    glow(X,bx,by,lit?16:10,'#ffe7a8','rgba(150,100,40,.4)',lit?.9:.4+.15*Math.sin(clock*4));X.fillStyle='#fff6cf';X.fillRect(bx|0,by|0,1,1);
    // alcance del destello: aparece cuando hay un monstruo vulnerable cerca
    if(state==='play'&&p.energy>=25&&!p.fcd&&monsters.some(m=>m.vul)){X.strokeStyle='rgba(255,231,168,'+(.25+.2*Math.sin(clock*12))+')';X.lineWidth=1;X.beginPath();X.arc(bx,by,BIO[bio].x==='hadal'?95:135,0,TAU);X.stroke()}
    if(p.heat)glow(X,p.x,p.y,16,'#ff5a2a','rgba(150,30,0,.3)',.35+.2*Math.sin(clock*20));
    if(p.hidden&&state==='play'){X.globalAlpha=.6;text('OCULTO',p.x,p.y-24,1,'#8fc3b6',1);X.globalAlpha=1}
  }
  for(let m of monsters){
    let ex=m.x-m.dir*2*m.k,ey=m.y-3*m.k;
    if(m.vul&&state==='play'){let k=(clock*8|0)%2,y=m.y-22*m.k|0;X.fillStyle=k?'#ffffff':'#ffd36b';X.fillRect(m.x-6|0,y-6,13,13);X.fillStyle='#200808';X.fillRect(m.x-5|0,y-5,11,11);text('!',m.x|0,y-3,1,k?'#ffffff':'#ffd36b',1)}
    if(m.stun>0){X.fillStyle='#fff8d0';for(let k=0;k<3;k++)X.fillRect(m.x+Math.cos(clock*6+k*2.1)*8*m.k|0,m.y-13*m.k+Math.sin(clock*6+k*2.1)*3|0,1,1)}
    else if(m.st==='wind'){pic(X,HEAD[0],m.x+irand(3)-1,m.y,m.dir<0,2*m.k,.35);glow(X,ex,ey,16,'#ff3a2a','rgba(200,0,30,.5)',.95);X.fillStyle='#ffffff';X.fillRect(ex-1|0,ey|0,3,2)}
    else if(m.memory>0){glow(X,ex,ey,9,'#ff6a4a','rgba(140,0,30,.4)',.75);X.fillStyle='#ffd0b0';X.fillRect(ex|0,ey|0,2,2)}
  }
  layer(X,FG);X.restore();
  X.drawImage(VG,0,0);
  if(danger>.05){X.globalAlpha=Math.min(1,danger*(.6+.3*Math.sin(clock*8)));X.drawImage(RV,0,0);X.globalAlpha=1}
  if(flashT>0){X.globalCompositeOperation='lighter';X.globalAlpha=flashT*flashT*.55;X.fillStyle='#fff6e0';X.fillRect(0,0,W,H);X.globalAlpha=1;X.globalCompositeOperation='source-over'}
  for(let q of pops){X.globalAlpha=clamp(q.t,0,1);text(q.s,q.x,q.y|0,1,q.col,1,1);X.globalAlpha=1}
}
function bar(y,v,col,label){text(label,10,y,1,'#6fa7a0',0,1);X.fillStyle='#04121a';X.fillRect(54,y,102,5);X.fillStyle=col;X.fillRect(55,y+1,v|0,3);for(let i=1;i<4;i++){X.fillStyle='#02090e';X.fillRect(55+i*25,y+1,1,3)}}
function hud(){
  let score=pts+(run|0)*5,blink=(clock*6|0)%2,c=p.hunger<25?'#ff4a5e':p.hunger<50?'#f0a24a':'#4fe0bd';
  if(p.hunger<25&&blink||p.heat&&(clock*10|0)%2)c='#7a1c2c';
  bar(9,p.hunger,c,'HAMBRE');
  bar(18,p.energy,p.lock?(blink?'#7a3a1c':'#3a1c0c'):p.energy<25?'#9a6a3a':'#ffcf7a','LUZ');X.fillStyle='#ffffff';X.fillRect(80,17,1,7);
  let label='PUNTOS '+score,w=label.length*4-1;text(label,W-10-w,9,1,'#bfe8dc',0,1);
  if(combo>1){let s='COMBO X'+combo,cw=s.length*4-1;text(s,W-10-cw,18,1,'#ffe7a8',0,1);X.fillStyle='#ffe7a8';X.fillRect(W-10-cw,25,cw*clamp(comboT/2.4,0,1)|0,1)}
  text((run/60|0)+':'+String(run%60|0).padStart(2,'0')+'  PROF '+(depth+1)*1000+'M',W/2,9,1,'#5e8e90',1,1);
  text('CAMARONES '+got+'/'+need,W/2,18,1,'#8fc3b6',1,1);
  if(state!=='play')return;
  if(banner>0&&(banner<3.2||(clock*4|0)%2)){text(depth?'DESCIENDES A '+(depth+1)*1000+' M':'1000 M BAJO EL MAR',W/2,90,2,'#ff4a5e',1,1);text(BIO[bio].n,W/2,108,1,'#e8d6b0',1,1);text(BIO[bio].t,W/2,120,1,'#8fc3b6',1,1)}
  text('P PAUSA  M '+(muted?'MUDO':'SONIDO'),10,H-10,1,'#24454e');
  let vul=monsters.some(m=>m.vul),h=banner>0?'':vul&&p.energy>=25?'TOCA ESPACIO  AHORA!':run<10?'MANTEN ESPACIO PARA ILUMINAR':usedFlash<3&&run<60?'OJO ROJO CERCA: TOCA ESPACIO  DESTELLO':'';
  if(h)text(h,W/2,34,1,vul?((clock*8|0)%2?'#ffffff':'#ffd36b'):'#8fc3b6',1,1);
}
function panel(y,h){X.fillStyle='rgba(0,2,8,.55)';X.fillRect(0,0,W,H);let g=X.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(1,5,12,0)');g.addColorStop(.25,'rgba(1,5,12,.9)');g.addColorStop(.75,'rgba(1,5,12,.9)');g.addColorStop(1,'rgba(1,5,12,0)');X.fillStyle=g;X.fillRect(0,y,W,h);g=X.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(79,224,189,0)');g.addColorStop(.5,'rgba(79,224,189,.35)');g.addColorStop(1,'rgba(79,224,189,0)');X.fillStyle=g;X.fillRect(0,y,W,1);X.fillRect(0,y+h-1,W,1)}
function title(){
  scene(X,0);renderFish(clock);let LL=lure(clock),fx_=W/2+LL.x*2,fy=146+LL.y*2;
  glow(X,fx_,fy,90,'rgba(255,200,120,.9)','rgba(30,140,140,.35)',.22);pic(X,FC,W/2,146,0,2);glow(X,fx_,fy,14,'#fff0b8','rgba(160,110,40,.5)',.7+Math.sin(clock*3)*.2);
  for(let s of snow)if(s.g>0)glow(X,sx(s),s.y,4,BIO[bio].pg,'rgba(30,160,150,.4)',s.g*.8);layer(X,FG);X.drawImage(VG,0,0);
  text('LUMINISCIDIO',W/2,38,5,'#d3f2e4',1,1);text('EL FARO DE CARNE',W/2,74,2,'#d23c55',1,1);
  text('COME CON LA BOCA. ESQUIVA LAS EMBESTIDAS.',W/2,176,1,'#8fc3b6',1,1);
  text('WASD / FLECHAS  NADAR',W/2,190,1,'#4f8088',1);
  text('MANTEN ESPACIO  LUZ     TOCA ESPACIO  DESTELLO',W/2,200,1,'#4f8088',1);
  text('OJO ROJO CERCA: DESTELLO.  LOS DORADOS HUYEN DE LA LUZ.',W/2,210,1,'#4f8088',1);
  if((clock*2|0)%2)text('PULSA ESPACIO PARA SUMERGIRTE',W/2,232,1,'#ffe7a8',1,1);
  if(best)text('RECORD '+best,W/2,251,1,'#5e8e90',1,1);
}
function dead(){
  world();hud();panel(64,166);
  let t={HAMBRE:['LA LUZ SE APAGO','EL FARO NECESITABA COMER','#ffcf7a'],EMBESTIDA:['EMBESTIDO','NO ESQUIVASTE LA CARGA','#ff4a5e'],DEVORADO:['DEVORADO','TE TOPASTE CON LA CARNE','#ff4a5e']}[death],score=pts+(run|0)*5;
  text(t[0],W/2,78,3,t[2],1,1);text(t[1],W/2,104,1,'#86aaa2',1);
  text('PUNTOS '+score,W/2,124,2,'#eef6d2',1,1);
  text('CAMARONES '+eaten+'   TIEMPO '+(run|0)+'S',W/2,144,1,'#6f9993',1);
  text(BIO[bio].n+'   '+(depth+1)*1000+' M',W/2,157,1,'#e8d6b0',1);
  text('RECORD '+best,W/2,170,1,'#6f9993',1);
  text('ESPACIO / R  VOLVER A NADAR',W/2,212,1,'#ffe7a8',1);
}
function draw(){X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;if(state==='title')title();else if(state==='dead')dead();else{world();hud();if(state==='pause'){panel(101,59);text('PAUSA',W/2,113,3,'#d3f2e4',1,1);text('P PARA CONTINUAR',W/2,143,1,'#6f9993',1)}}}
function frame(ms){requestAnimationFrame(frame);let dt=Math.min(.033,(ms-last)/1000||0);last=ms;clock=ms/1000;bfade=Math.min(1,bfade+dt*.45);if(state==='play')update(dt);if(state!=='pause'){drift(dt);let tx=state==='title'?W/2+Math.sin(clock*.25)*90:p.x,ty=state==='title'?H/2:p.y,k=Math.min(1,dt*2.5);camx+=(W/2-tx-camx)*k;camy+=(H/2-ty-camy)*k}draw()}
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!e.repeat){if(e.code==='KeyM')audio.toggle();if(e.code==='Space')tapT=performance.now();if(e.code==='KeyP'&&(state==='play'||state==='pause'))state=state==='play'?'pause':'play';if((state==='title'||state==='dead')&&['Space','Enter','KeyR'].includes(e.code))start()}keys[e.code]=true});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space'&&state==='play'&&performance.now()-tapT<220)keys.fx=1});
addEventListener('blur',()=>{keys={};if(state==='play')state='pause'});
build();addEventListener('resize',build);
C.addEventListener('pointerdown',()=>{if(state==='title'||state==='dead')start();C.focus()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause'});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
