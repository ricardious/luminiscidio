 g.globalCompositeOperation='lighter';g.fillStyle=grad(g,['rgba(110,190,255,1)','rgba(110,190,255,0)'],210);for(let i=0;i<3;i++){let x=70+i*160+Math.sin(clock*.2+i*2)*18+camx*.04;g.globalAlpha=lit?.07:.035;g.beginPath();g.moveTo(x-6,0);g.lineTo(x+12,0);g.lineTo(x+80,210);g.lineTo(x+22,210);g.fill()}g.globalAlpha=1;g.globalCompositeOperation='source-over';
 layer(g,S.l[0]);
 for(let j of jellies){let x=j.x+camx*j.z,y=j.y+Math.sin(j.p*.9)*3,a=.35+Math.sin(j.p*1.7)*.15;glow(g,x,y,9,j.c,'rgba(40,40,120,.25)',a*(lit?.7:1));g.globalAlpha=a;g.fillStyle=j.c;g.fillRect(x-1|0,y|0,3,1);for(let k=0;k<3;k++)g.fillRect(x-1+k|0,y+2+Math.sin(j.p*3+k)|0,1,1);g.globalAlpha=1}
 layer(g,S.l[1]);
 for(let s of snow){let x=sx(s);g.fillStyle=lit?(s.z>.7?'#86bfc0':'#2f5d6d'):(s.z>.7?'#12283c':'#081526');let z=s.z>.88?2:1;g.fillRect(x|0,s.y|0,z,z)}
 g.fillStyle=grad(g,[S.frim,S.floor],H,249);g.fillRect(0,249,W,21);g.fillStyle=S.frim;g.fillRect(0,249,W,1);
 for(let r of rocks)pic(g,ROCK,r.x,r.y,0,r.s,lit?1:.35);if(lit)for(let b of bones)pic(g,BONE,b.x,b.y,0,1,.5)}
function drawMonster(g,m){for(let j=m.parts.length-1;j>=0;j--){let b=m.parts[j],lead=j?m.parts[j-1]:m;pic(g,BODY,b.x,b.y,lead.x<b.x,2*m.k,1-j*.07)}pic(g,HEAD[(clock*6|0)%2],m.x,m.y,m.dir<0,2*m.k)}
function lightMask(bx,by){L.clearRect(0,0,W,H);let r=77+Math.sin(clock*17)*1.5;for(let i=6;i>=1;i--){L.fillStyle=`rgba(255,255,255,${.2+(6-i)*.14})`;L.beginPath();L.arc(bx,by,r*i/6,0,TAU);L.fill()}for(let i=0;i<150;i++){let a=i*2.399+clock*.03,rr=r*(.8+((i*37+((clock*8)|0)*13)%31)/100),sz=i%7===0?2:1;L.fillStyle=`rgba(255,255,255,${.12+(i%5)*.04})`;L.fillRect((bx+Math.cos(a)*rr)|0,(by+Math.sin(a)*rr)|0,sz,sz)}Q.globalCompositeOperation='destination-in';Q.drawImage(M,0,0);Q.globalCompositeOperation='source-over'}
function world(){let ox=shake?irand(3)-1:0,oy=shake?irand(3)-1:0,lit=state==='play'&&p.light,sp=Math.hypot(p.vx||0,p.vy||0),LL=lure(clock,sp),bx=p.x+p.dir*LL.x,by=p.y+LL.y;if(p.x)renderFish(clock,sp);X.save();X.translate(ox,oy);ocean(X,0);
 if(lit){Q.clearRect(0,0,W,H);ocean(Q,1);for(let s of shrimp){pic(Q,SHRIMP[(clock*8+s.p|0)%2],s.x,s.y,s.vx<0,1);glow(Q,s.x,s.y,7,'#ffb347','rgba(120,50,10,.3)',.35)}for(let m of monsters)drawMonster(Q,m);pic(Q,FC,p.x,p.y,p.dir<0,1);for(let f of fx){Q.fillStyle=f.col;Q.globalAlpha=clamp(f.life*2,0,1);Q.fillRect(f.x|0,f.y|0,2,2)}Q.globalAlpha=1;lightMask(bx,by);X.drawImage(V,0,0);glow(X,bx,by,105,'rgba(255,205,130,1)','rgba(40,170,160,.45)',.3)}
 else if(p.x){pic(X,FC,p.x,p.y,p.dir<0,1,.24);for(let f of fx){X.globalAlpha=clamp(f.life,0,.6);X.fillStyle=f.col;X.fillRect(f.x|0,f.y|0,1,1)}X.globalAlpha=1}
 for(let s of snow)if(s.g>0)glow(X,sx(s),s.y,4,'#7ffbe6','rgba(30,160,150,.4)',s.g*.8);
 if(p.x){glow(X,bx,by,lit?16:10,'#ffe7a8','rgba(150,100,40,.4)',lit?.9:.4+.15*Math.sin(clock*4));X.fillStyle='#fff6cf';X.fillRect(bx|0,by|0,1,1)}
 // los que te cazan delatan sus ojos en la oscuridad
 for(let m of monsters)if(m.memory>0){let ex=m.x-m.dir*2*m.k,ey=m.y-3*m.k;glow(X,ex,ey,9,'#ff6a4a','rgba(140,0,30,.4)',.75);X.fillStyle='#ffd0b0';X.fillRect(ex|0,ey|0,2,2)}
 layer(X,FG);X.restore();X.drawImage(VG,0,0);if(danger>.05){X.globalAlpha=Math.min(1,danger*(.6+.3*Math.sin(clock*8)));X.drawImage(RV,0,0);X.globalAlpha=1}}
function hud(){let score=pts+(run|0)*5;text('HAMBRE',10,9,1,'#6fa7a0',0,1);X.fillStyle='#04121a';X.fillRect(54,9,102,5);let col=p.hunger<25?'#ff4a5e':p.hunger<50?'#f0a24a':'#4fe0bd';if(p.hunger<25&&(clock*6|0)%2)col='#7a1c2c';X.fillStyle=col;X.fillRect(55,10,p.hunger|0,3);for(let i=1;i<4;i++){X.fillStyle='#02090e';X.fillRect(55+i*25,10,1,3)}let label='PUNTOS '+score,w=label.length*4-1;text(label,W-10-w,9,1,'#bfe8dc',0,1);text((run/60|0)+':'+String(run%60|0).padStart(2,'0')+'  PROF '+(depth+1)*1000+'M',W/2,9,1,'#5e8e90',1,1);if(state==='play'&&banner>0&&(clock*4|0)%4){text('DESCIENDES A '+(depth+1)*1000+' M',W/2,96,2,'#ff4a5e',1,1);text('LA CARNE TE HUELE MEJOR',W/2,114,1,'#c9867a',1,1)}if(state==='play'){text('P PAUSA  M '+(muted?'MUDO':'SONIDO'),10,H-10,1,'#24454e');if(run<7)text('MANTEN ESPACIO PARA ILUMINAR',W/2,28,1,'#8fc3b6',1,1)}}
function panel(y,h){X.fillStyle='rgba(0,2,8,.55)';X.fillRect(0,0,W,H);let g=X.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(1,5,12,0)');g.addColorStop(.25,'rgba(1,5,12,.9)');g.addColorStop(.75,'rgba(1,5,12,.9)');g.addColorStop(1,'rgba(1,5,12,0)');X.fillStyle=g;X.fillRect(0,y,W,h);g=X.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(79,224,189,0)');g.addColorStop(.5,'rgba(79,224,189,.35)');g.addColorStop(1,'rgba(79,224,189,0)');X.fillStyle=g;X.fillRect(0,y,W,1);X.fillRect(0,y+h-1,W,1)}
function title(){ocean(X,0);renderFish(clock);let LL=lure(clock),fx_=W/2+LL.x*2,fy=151+LL.y*2;glow(X,fx_,fy,90,'rgba(255,200,120,.9)','rgba(30,140,140,.35)',.22);pic(X,FC,W/2,151,0,2);glow(X,fx_,fy,14,'#fff0b8','rgba(160,110,40,.5)',.7+Math.sin(clock*3)*.2);
 for(let s of snow)if(s.g>0)glow(X,sx(s),s.y,4,'#7ffbe6','rgba(30,160,150,.4)',s.g*.8);layer(X,FG);X.drawImage(VG,0,0);
 text('LUMINISCIDIO',W/2,43,5,'#d3f2e4',1,1);text('EL FARO DE CARNE',W/2,79,2,'#d23c55',1,1);text('COME LO DORADO. TEME LA CARNE.',W/2,182,1,'#8fc3b6',1,1);text('WASD / FLECHAS  NADAR',W/2,198,1,'#4f8088',1);text('MANTEN ESPACIO  ENCENDER LA LUZ',W/2,209,1,'#4f8088',1);if((clock*2|0)%2)text('PULSA ESPACIO PARA SUMERGIRTE',W/2,232,1,'#ffe7a8',1,1);if(best)text('RECORD '+best,W/2,251,1,'#5e8e90',1,1)}
function dead(){world();hud();panel(72,150);let h=death==='HAMBRE';text(h?'LA LUZ SE APAGO':'DEVORADO',W/2,88,3,h?'#ffcf7a':'#ff4a5e',1,1);text(h?'EL ABISAL NECESITABA COMER':'LA CARNE TE ENCONTRO',W/2,115,1,'#86aaa2',1);let score=pts+(run|0)*5;text('PUNTOS '+score,W/2,139,2,'#eef6d2',1,1);text('CAMARONES '+eaten+'   TIEMPO '+(run|0)+'S',W/2,158,1,'#6f9993',1);text('RECORD '+best+'   PROF '+(depth+1)*1000+'M',W/2,172,1,'#6f9993',1);text('ESPACIO / R  VOLVER A NADAR',W/2,207,1,'#ffe7a8',1)}
function draw(){X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;if(state==='title')title();else if(state==='dead')dead();else{world();hud();if(state==='pause'){panel(101,59);text('PAUSA',W/2,113,3,'#d3f2e4',1,1);text('P PARA CONTINUAR',W/2,143,1,'#6f9993',1)}}}
function frame(ms){requestAnimationFrame(frame);let dt=Math.min(.033,(ms-last)/1000||0);last=ms;clock=ms/1000;if(state==='play')update(dt);if(state!=='pause'){drift(dt);let tx=state==='title'?W/2+Math.sin(clock*.25)*90:p.x,ty=state==='title'?H/2:p.y,k=Math.min(1,dt*2.5);camx+=(W/2-tx-camx)*k;camy+=(H/2-ty-camy)*k}draw()}
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!e.repeat){if(e.code==='KeyM')audio.toggle();if(e.code==='KeyP'&&(state==='play'||state==='pause'))state=state==='play'?'pause':'play';if((state==='title'||state==='dead')&&['Space','Enter','KeyR'].includes(e.code))start()}keys[e.code]=true});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys={};if(state==='play')state='pause'});build();addEventListener('resize',build);C.addEventListener('pointerdown',()=>{if(state==='title'||state==='dead')start();C.focus()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause'});requestAnimationFrame(frame);
})();
