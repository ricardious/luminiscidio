<body>
<canvas id="game" width="480" height="270" tabindex="0" aria-label="Abisal: El Faro de Carne. Usa WASD o flechas para nadar y mantén espacio para encender la luz."></canvas>
<script>
(()=>{'use strict';
const W=480,H=270,TAU=Math.PI*2,C=document.getElementById('game'),X=C.getContext('2d',{alpha:false});
const surface=()=>{let c=document.createElement('canvas');c.width=W;c.height=H;return c},V=surface(),M=surface(),Q=V.getContext('2d'),L=M.getContext('2d');

let seed=713;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);

const fishPal={A:'#294a50',B:'#4f8078',C:'#89ae91',D:'#d7dfac',E:'#071014',F:'#dcffd0',G:'#b8ffd1',T:'#335e60'},fishRows=[
['..............G...','..............A...','.............A....','......AAA....A....','...AABBBAAAAAA....','..ABBCCCCCCAEEA...','.TABCCCCCCCCCDA...','..TABBBBCCAAAA....','...T.AA..A.A......','....T...........','.....T..........'],
['..............G...','..............A...','.............A....','......AAA....A....','...AABBBAAAAAA....','..ABBCCCCCCAEEA...','T.ABCCCCCCCCCDA...','..TABBBBCCAAAA....','....TAA..A.A......','.....T..........','......T.........']],FISH=fishRows.map(r=>sprite(r,fishPal));
const SHRIMP=[

['...G....','..GYG...','.GYWYG..','.GYGYG..','.G..G...','..G.....']].map(r=>sprite(r,{G:'#f6c453',Y:'#a85c32',W:'#fff2a8'}));
const ROCK=sprite(['........AAAA............','......AABBBAA...........','.....ABBBDBBAA..........','....ABBDDDBBBBA.........','...ABBDDDBBBDBBA...AA...','..ABBDBBBBDDDDA..ABBA...','..ABBBBBBBDDDDDAAABBBA..','.AAAAAAAAAAAAAAAAAAAAA..'],{A:'#14242d',B:'#1c3038',D:'#0b171f'});
const BONE=sprite(['..W........W....','.WWW......WWW...','..WWWWWWWWWW....','.WWW......WWW...','..W........W....'],{W:'#797b68'});
const headRows=[
['......AAAA..............','...AAAAAAAAAAAA.........','..AABBBBBBBBBBAA........','.ABBBBBBBBBEBBBA........','ABBBBBBBBBEEEBBBBA......','ABBBBBBBBBEEEBBBBBAA....','ABBBBBBBBBBEBBBBBBBBA...','ABBBBBBBBBBBBBBBBBBBBBA.','ABBBWWWWWWWWWWWWWWBBBBA.','.ABBTWTWTWTWTWTWTWTBBA..','..ABBBBBBBBBBBBBBBBA....','...AAAAAAAAAAAAAAAA.....'],
['......AAAA..............','...AAAAAAAAAAAA.........','..AABBBBBBBBBBAA........','.ABBBBBBBBBEBBBA........','ABBBBBBBBBEEEBBBBA......','ABBBBBBBBBEEEBBBBBAA....','ABBBBBBBBBBEBBBBBBBBA...','ABBBBBBBBBBBBBBBBBBBBBA.','ABBBBBBBBBBBBBBBBBBBBBA.','.ABBWTWTWTWTWTWTWTWBBA..','..ABBBBBBBBBBBBBBBBA....','...AAAAAAAAAAAAAAAA.....']];
const flesh={A:'#321e2b',B:'#74474d',D:'#4b2c39',E:'#d8e6bd',W:'#d5c9a2',T:'#8e3742'},HEAD=headRows.map(r=>sprite(r,flesh)),BODY=sprite(['...AAAA.....','.AABBBBAA...','AABBBBBBBAA.','ABBDBBBDBBBA','ABBBBBBBBBBA','.ABBBDBBBBA.','..AABBBBAA..','....AAAA....'],flesh);
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'101111111111101',O:'010101101101010',P:'110101110100100',Q:'010101101111011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'010101101101010','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101010','7':'111001010010010','8':'010101010101010','9':'010101111001110',' ':'000000000000000','-':'000000111000000',':':'000010000010000','/':'001001010100100','!':'010010010000010','?':'110001010000010','.':'000000000000010','+':'000010111010000'};
function text(s,x,y,z=1,col='#91b7ad',center=0){s=(s+'').toUpperCase();let w=(s.length*4-1)*z;if(center)x-=w/2|0;X.fillStyle=col;[...s].forEach((c,i)=>{let g=FONT[c]||FONT['?'];for(let n=0;n<15;n++)if(g[n]==='1')X.fillRect(x+i*4*z+(n%3)*z,y+(n/3|0)*z,z,z)})}
function pic(c,s,x,y,flip=0,scale=1,alpha=1){c.save();c.globalAlpha=alpha;c.translate(Math.round(x),Math.round(y));if(flip)c.scale(-1,1);c.drawImage(s,-s.width*scale/2|0,-s.height*scale/2|0,s.width*scale,s.height*scale);c.restore()}
const rocks=Array.from({length:8},(_,i)=>({x:20+i*65+rnd()*22,y:247+rnd()*7,s:rnd()>.65?2:1})),bones=Array.from({length:7},()=>({x:rnd()*W,y:239+rnd()*20}));
const snow=Array.from({length:100},()=>({x:rnd()*W,y:rnd()*H,z:rnd(),p:rnd()*TAU}));
let state='title',keys={},p={},shrimp=[],monsters=[],fx=[],run=0,eaten=0,spawnClock=9,beat=0,shake=0,death='',best=0,muted=false,last=0,clock=0;
try{best=+localStorage.abisalBest||0;muted=localStorage.abisalMute==='1'}catch(e){}
const audio={ctx:null,master:null,init(){if(this.ctx){this.ctx.resume();return}let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let a=this.ctx=new A(),g=this.master=a.createGain();g.gain.value=muted?0:.45;g.connect(a.destination);let n=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.15;let src=a.createBufferSource(),f=a.createBiquadFilter(),ng=a.createGain();src.buffer=n;src.loop=true;f.type='lowpass';f.frequency.value=170;ng.gain.value=.12;src.connect(f);f.connect(ng);ng.connect(g);src.start();let o=a.createOscillator(),og=a.createGain();o.type='sine';o.frequency.value=38;og.gain.value=.025;o.connect(og);og.connect(g);o.start()},tone(f,d=.15,type='sine',v=.12,end=f){if(!this.ctx||muted)return;let a=this.ctx,n=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(10,end),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(this.master);o.start(n);o.stop(n+d)},noise(d=.25,v=.15){if(!this.ctx||muted)return;let a=this.ctx,b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),q=b.getChannelData(0);for(let i=0;i<q.length;i++)q[i]=(Math.random()*2-1)*(1-i/q.length);let s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(this.master);s.start()},toggle(){muted=!muted;if(this.master)this.master.gain.value=muted?0:.45;try{localStorage.abisalMute=muted?'1':'0'}catch(e){}}};
function addShrimp(away=0){let s,tries=0;do{s={x:18+Math.random()*(W-36),y:35+Math.random()*195,vx:0,vy:0,p:Math.random()*TAU};tries++}while(away&&p.x&&dist(s,p)<95&&tries<20);shrimp.push(s)}
function reset(){p={x:W/2,y:125,vx:0,vy:0,dir:1,hunger:100,light:false};shrimp=[];monsters=[];fx=[];run=eaten=0;spawnClock=9;beat=shake=0;for(let i=0;i<8;i++)addShrimp();state='play';C.focus()}
function start(){audio.init();reset()}
function die(why){if(state!=='play')return;death=why;state='dead';p.light=false;let score=eaten*100+(run|0)*5;if(score>best){best=score;try{localStorage.abisalBest=best}catch(e){}}audio.noise(.8,.35);audio.tone(110,.9,'sawtooth',.2,24)}
function burst(x,y,col,n=12){for(let i=0;i<n;i++){let a=Math.random()*TAU,s=8+Math.random()*28;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.5,col})}}
function spawnMonster(){let side=irand(3),x,y;if(side===0){x=-70;y=45+Math.random()*175}else if(side===1){x=W+70;y=45+Math.random()*175}else{x=40+Math.random()*(W-80);y=-65}let m={x,y,vx:0,vy:0,dir:x<W/2?1:-1,memory:0,tx:W/2,ty:130,wx:W/2,wy:130,age:0,speed:18+Math.min(15,run*.035),parts:[],phase:Math.random()*TAU};for(let i=0;i<6;i++)m.parts.push({x:x-m.dir*(i+1)*18,y});monsters.push(m);audio.tone(52,1.4,'sawtooth',.16,29);audio.noise(.7,.09)}
function update(dt){run+=dt;let ax=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ay=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0),l=Math.hypot(ax,ay)||1;ax/=l;ay/=l;p.vx+=ax*150*dt;p.vy+=ay*150*dt;let drag=Math.exp(-(ax||ay?3.5:6)*dt);p.vx*=drag;p.vy*=drag;let sp=Math.hypot(p.vx,p.vy),max=57;if(sp>max){p.vx*=max/sp;p.vy*=max/sp}p.x=clamp(p.x+p.vx*dt,10,W-10);p.y=clamp(p.y+p.vy*dt,29,234);if(Math.abs(p.vx)>3)p.dir=p.vx>0?1:-1;let was=p.light;p.light=!!keys.Space;if(p.light&&!was)audio.tone(310,.08,'sine',.035,420);p.hunger-=dt*(1.25+Math.min(.75,run*.004));if(p.hunger<=0){p.hunger=0;die('HAMBRE');return}
for(let i=0;i<shrimp.length;i++){let s=shrimp[i];s.p+=dt*5;let dx=p.x-s.x,dy=p.y-s.y,d=Math.hypot(dx,dy)||1;if(p.light&&d<150){s.vx+=dx/d*34*dt;s.vy+=dy/d*34*dt}else{s.vx+=Math.cos(s.p*.37)*3*dt;s.vy+=Math.sin(s.p*.29)*2*dt}let ss=Math.hypot(s.vx,s.vy);if(ss>25){s.vx*=25/ss;s.vy*=25/ss}s.vx*=Math.exp(-1.8*dt);s.vy*=Math.exp(-1.8*dt);s.x=clamp(s.x+s.vx*dt,8,W-8);s.y=clamp(s.y+s.vy*dt,28,233);if(d<9){shrimp.splice(i--,1);eaten++;p.hunger=Math.min(100,p.hunger+24);burst(s.x,s.y,'#f6c453');audio.tone(520,.12,'square',.09,760);addShrimp(1)}}
spawnClock-=dt;if(spawnClock<=0&&monsters.length<Math.min(3,1+(run/50|0))){spawnMonster();spawnClock=Math.max(6,13-run*.045)+Math.random()*4}let danger=0;
for(let i=0;i<monsters.length;i++){let m=monsters[i];m.age+=dt;m.phase+=dt*3;let d=dist(m,p);danger=Math.max(danger,clamp(1-d/170,0,1));if(p.light&&d<220){m.memory=1.8;m.tx=p.x;m.ty=p.y}else m.memory-=dt;let target=m.memory>0;if(!target&&Math.hypot(m.wx-m.x,m.wy-m.y)<35){m.wx=40+Math.random()*(W-80);m.wy=45+Math.random()*175}let tx=target?m.tx:m.wx,ty=target?m.ty:m.wy,dx=tx-m.x,dy=ty-m.y,dd=Math.hypot(dx,dy)||1,s=m.speed*(target?1:.48);m.vx+=(dx/dd*s-m.vx)*dt*1.4;m.vy+=(dy/dd*s-m.vy)*dt*1.4;m.x+=m.vx*dt;m.y+=m.vy*dt;if(Math.abs(m.vx)>1)m.dir=m.vx>0?1:-1;let lead=m;for(let j=0;j<m.parts.length;j++){let b=m.parts[j],dx=lead.x-b.x,dy=lead.y-b.y,d=Math.hypot(dx,dy)||1;b.x=lead.x-dx/d*15;b.y=lead.y-dy/d*15+Math.sin(m.phase-j*.7)*.9;lead=b}if(m.age>1.5&&(d<17||m.parts.some((b,j)=>j<4&&dist(b,p)<10))){die('DEVORADO');return}if(m.age>15&&(m.x<-160||m.x>W+160||m.y<-150||m.y>H+150)){monsters.splice(i--,1)}}
beat-=dt;if(danger>.12&&beat<=0){audio.tone(48,.13,'sine',.07+danger*.07,36);beat=1.15-danger*.72}shake=danger*1.2;for(let i=0;i<fx.length;i++){let f=fx[i];f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.94;f.vy*=.94;if(f.life<=0)fx.splice(i--,1)}}
function ocean(g,lit){g.fillStyle=lit?'#081620':'#010207';g.fillRect(0,0,W,H);for(let s of snow){let x=(s.x+Math.sin(clock*.15+s.p)*4+W)%W,y=(s.y+clock*(.25+s.z*1.4))%H;g.fillStyle=lit?(s.z>.65?'#37555b':'#172d38'):(s.z>.8?'#0b161d':'#04090f');let z=s.z>.85?2:1;g.fillRect(x|0,y|0,z,z)}g.fillStyle=lit?'#0c1920':'#02050a';g.fillRect(0,249,W,21);for(let r of rocks)pic(g,ROCK,r.x,r.y,0,r.s,lit?1:.3);if(lit)for(let b of bones)pic(g,BONE,b.x,b.y,0,1,.45)}
function drawMonster(g,m){for(let j=m.parts.length-1;j>=0;j--){let b=m.parts[j],lead=j?m.parts[j-1]:m;pic(g,BODY,b.x,b.y,lead.x<b.x,2,1-j*.045)}pic(g,HEAD[(clock*6|0)%2],m.x,m.y,m.dir<0,2);if(m.memory>0){g.fillStyle='#e5efc5';let ex=m.x+m.dir*8,ey=m.y-5;g.fillRect(ex|0,ey|0,2,1)}}
function lightMask(){L.clearRect(0,0,W,H);let bx=p.x+p.dir*5,by=p.y-6,r=77+Math.sin(clock*17)*1.5;for(let i=6;i>=1;i--){L.fillStyle=`rgba(255,255,255,${.2+(6-i)*.14})`;L.beginPath();L.arc(bx,by,r*i/6,0,TAU);L.fill()}for(let i=0;i<150;i++){let a=i*2.399+clock*.03,rr=r*(.8+((i*37+((clock*8)|0)*13)%31)/100),sz=i%7===0?2:1;L.fillStyle=`rgba(255,255,255,${.12+(i%5)*.04})`;L.fillRect((bx+Math.cos(a)*rr)|0,(by+Math.sin(a)*rr)|0,sz,sz)}L.fillStyle='#e7ffd0';L.fillRect(bx|0,by|0,2,2);Q.globalCompositeOperation='destination-in';Q.drawImage(M,0,0);Q.globalCompositeOperation='source-over'}
function world(){let ox=shake?irand(3)-1:0,oy=shake?irand(3)-1:0;X.save();X.translate(ox,oy);ocean(X,false);if(state==='play'&&p.light){Q.clearRect(0,0,W,H);ocean(Q,true);for(let s of shrimp)pic(Q,SHRIMP[(clock*8+s.p|0)%2],s.x,s.y,s.vx<0,1);for(let m of monsters)drawMonster(Q,m);pic(Q,FISH[(clock*9|0)%2],p.x,p.y,p.dir<0,1);for(let f of fx){Q.fillStyle=f.col;Q.globalAlpha=clamp(f.life*2,0,1);Q.fillRect(f.x|0,f.y|0,2,2)}Q.globalAlpha=1;lightMask();X.drawImage(V,0,0)}else if(p.x){pic(X,FISH[0],p.x,p.y,p.dir<0,1,.18);for(let f of fx){X.globalAlpha=clamp(f.life,0,.5);X.fillStyle=f.col;X.fillRect(f.x|0,f.y|0,1,1)}X.globalAlpha=1}X.restore()}
function hud(){let score=eaten*100+(run|0)*5;text('HAMBRE',10,9,1,'#698a83');X.fillStyle='#102028';X.fillRect(54,9,100,5);let col=p.hunger<25?'#a8444c':p.hunger<50?'#c18b45':'#65a38d';X.fillStyle=col;X.fillRect(55,10,p.hunger|0,3);for(let i=1;i<4;i++){X.fillStyle='#071016';X.fillRect(55+i*25,10,1,3)}let label='PUNTOS '+score,w=label.length*4-1;text(label,W-10-w,9,1,'#91b7ad');text((run/60|0)+':'+String(run%60|0).padStart(2,'0'),W/2,9,1,'#526f70',1);if(state==='play'){text('P PAUSA  M '+(muted?'MUDO':'SONIDO'),10,H-10,1,'#263c42');if(run<7)text('MANTEN ESPACIO PARA ILUMINAR',W/2,28,1,'#66867f',1)}}
function panel(y,h){X.fillStyle='#03070ddd';X.fillRect(70,y,W-140,h);X.strokeStyle='#29434a';X.lineWidth=1;X.strokeRect(70.5,y+.5,W-141,h-1);for(let x=75;x<W-75;x+=7){X.fillStyle='#14272d';X.fillRect(x,y,2,1);X.fillRect(x,y+h-1,2,1)}}
function title(){ocean(X,false);pic(X,FISH[(clock*6|0)%2],W/2,151,0,2);let pulse=.4+Math.sin(clock*3)*.12;X.globalAlpha=pulse;X.fillStyle='#80bfa0';X.fillRect(W/2+27,137,3,3);X.globalAlpha=1;text('ABISAL',W/2,43,5,'#a5c9b1',1);text('EL FARO DE CARNE',W/2,79,2,'#7e4a50',1);text('COME LO DORADO. TEME LA CARNE.',W/2,177,1,'#6d8b83',1);text('WASD / FLECHAS  NADAR',W/2,195,1,'#45666a',1);text('MANTEN ESPACIO  ENCENDER LA LUZ',W/2,207,1,'#45666a',1);if((clock*2|0)%2)text('PULSA ESPACIO PARA SUMERGIRTE',W/2,232,1,'#d2d7aa',1);if(best)text('RECORD '+best,W/2,251,1,'#526e69',1)}
function dead(){world();hud();panel(74,119);text(death==='HAMBRE'?'LA LUZ SE APAGO':'DEVORADO',W/2,88,3,death==='HAMBRE'?'#a99057':'#b7575c',1);text(death==='HAMBRE'?'EL ABISAL NECESITABA COMER':'LA CARNE TE ENCONTRO',W/2,115,1,'#789189',1);let score=eaten*100+(run|0)*5;text('PUNTOS '+score,W/2,139,2,'#d1d7ac',1);text('CAMARONES '+eaten+'   TIEMPO '+(run|0)+'S',W/2,158,1,'#637f79',1);text('RECORD '+best,W/2,172,1,'#637f79',1);text('ESPACIO / R  VOLVER A NADAR',W/2,207,1,'#b5c9a7',1)}
function draw(){X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;if(state==='title')title();else if(state==='dead')dead();else{world();hud();if(state==='pause'){panel(101,59);text('PAUSA',W/2,113,3,'#a8c2aa',1);text('P PARA CONTINUAR',W/2,143,1,'#65817b',1)}}}
function frame(ms){requestAnimationFrame(frame);let dt=Math.min(.033,(ms-last)/1000||0);last=ms;clock=ms/1000;if(state==='play')update(dt);draw()}
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!e.repeat){if(e.code==='KeyM')audio.toggle();if(e.code==='KeyP'&&(state==='play'||state==='pause'))state=state==='play'?'pause':'play';if((state==='title'||state==='dead')&&['Space','Enter','KeyR'].includes(e.code))start()}keys[e.code]=true});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys={};if(state==='play')state='pause'});C.addEventListener('pointerdown',()=>{if(state==='title'||state==='dead')start();C.focus()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause'});requestAnimationFrame(frame);
})();
</script>
